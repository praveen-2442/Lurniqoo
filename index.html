<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lurniqoo</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAV -->
<div class="nav">
  <h2>Lurniqoo</h2>
  <button id="login-btn">Login</button>
</div>

<!-- HOME -->
<div id="home" class="view active">
  <h1>Welcome to Lurniqoo</h1>
  <button id="start">Start</button>
</div>

<!-- DEPARTMENT -->
<div id="dept" class="view">
  <div class="progress-bar">
    <div class="progress-step active-step">Dept</div>
    <div class="progress-step">Year</div>
    <div class="progress-step">Sem</div>
  </div>

  <button class="dept-btn" data-dept="AIML">AIML</button>
</div>

<!-- YEAR -->
<div id="year" class="view">
  <div class="progress-bar">
    <div class="progress-step active-step">Year</div>
  </div>

  <label class="choice-card">
    <input type="radio" name="year" value="1">
    <div class="card-content">1st Year</div>
  </label>

  <label class="choice-card">
    <input type="radio" name="year" value="2">
    <div class="card-content">2nd Year</div>
  </label>

  <button id="next-year">Next</button>
</div>

<!-- SEM -->
<div id="sem" class="view">
  <label>
    <input type="radio" name="sem" value="1"> Semester 1
  </label>

  <label>
    <input type="radio" name="sem" value="2"> Semester 2
  </label>

  <button id="next-sem">Next</button>
</div>

<!-- SUBJECTS -->
<div id="subjects" class="view">
  <div id="subjects-grid"></div>
</div>

<!-- AUTH MODAL -->
<div id="auth-modal" class="auth-modal hidden">
  <div class="auth-box">
    <h2>Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="login-submit">Login</button>
    <button id="signup-submit">Sign Up</button>

    <p id="auth-error"></p>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
